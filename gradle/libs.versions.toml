[versions]
# Java toolchain for all exercises; Gradle downloads it via foojay if it is missing.
java = "27"
junitJupiterVersion = "6.1.3"
assertJVersion = "3.27.7"

[libraries]
junit-jupiter-bom = { module = "org.junit:junit-bom", version.ref = "junitJupiterVersion" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertJVersion" }
